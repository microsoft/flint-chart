name: Publish npm packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[deploy]')
    env:
      # The package's type declarations outgrow Node's default heap.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@11

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true

      - name: Check package versions
        shell: bash
        run: |
          set -euo pipefail
          js_version=$(node -p "require('./packages/flint-js/package.json').version")
          mcp_version=$(node -p "require('./packages/flint-mcp/package.json').version")

          js_needs_publish=true
          mcp_needs_publish=true

          if npm view "flint-chart@${js_version}" version >/dev/null 2>&1; then
            echo "::notice::flint-chart@${js_version} is already published — skipping."
            js_needs_publish=false
          fi

          if npm view "flint-chart-mcp@${mcp_version}" version >/dev/null 2>&1; then
            echo "::notice::flint-chart-mcp@${mcp_version} is already published — skipping."
            mcp_needs_publish=false
          fi

          if [ "$js_needs_publish" = false ] && [ "$mcp_needs_publish" = false ]; then
            echo "::error::Both flint-chart@${js_version} and flint-chart-mcp@${mcp_version} are already published. Bump a package version before deploying."
            exit 1
          fi

          echo "js_version=${js_version}" >> "$GITHUB_ENV"
          echo "mcp_version=${mcp_version}" >> "$GITHUB_ENV"
          echo "js_needs_publish=${js_needs_publish}" >> "$GITHUB_ENV"
          echo "mcp_needs_publish=${mcp_needs_publish}" >> "$GITHUB_ENV"

      - name: Publish flint-chart
        if: env.js_needs_publish == 'true'
        run: npm publish --workspace packages/flint-js --access public

      - name: Wait for flint-chart to resolve
        if: env.js_needs_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Ask the registry itself: an earlier npm view cached the old packument for ~5 minutes
          # (max-age=300), which a plain npm view keeps serving. A large package can also take
          # several minutes to spread through npm's CDN, so wait up to 20 minutes.
          for attempt in {1..60}; do
            if curl -fsS -H 'Cache-Control: no-cache' "https://registry.npmjs.org/flint-chart/${js_version}" >/dev/null 2>&1 \
              && npm view "flint-chart@${js_version}" version --prefer-online >/dev/null 2>&1; then
              npm view "flint-chart@${js_version}" version --prefer-online
              exit 0
            fi
            echo "Waiting for flint-chart@${js_version} to be visible on npm (${attempt}/60)..."
            sleep 20
          done
          echo "::error::flint-chart@${js_version} did not become visible on npm in time."
          exit 1

      - name: Publish flint-chart-mcp
        if: env.mcp_needs_publish == 'true'
        run: |
          # flint-chart-mcp's prepublishOnly typechecks against the local
          # flint-chart workspace, which resolves to packages/flint-js/dist. When
          # the flint-chart publish above is skipped (already published), that dist
          # is never built and the typecheck fails with TS2307. Build it here so
          # the MCP typecheck always has resolvable flint-chart types.
          npm run build --workspace packages/flint-js
          npm publish --workspace packages/flint-mcp --access public

      - name: Wait for flint-chart-mcp to resolve
        if: env.mcp_needs_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Ask the registry itself: an earlier npm view cached the old packument for ~5 minutes
          # (max-age=300), which a plain npm view keeps serving. A large package can also take
          # several minutes to spread through npm's CDN, so wait up to 20 minutes.
          for attempt in {1..60}; do
            if curl -fsS -H 'Cache-Control: no-cache' "https://registry.npmjs.org/flint-chart-mcp/${mcp_version}" >/dev/null 2>&1 \
              && npm view "flint-chart-mcp@${mcp_version}" version --prefer-online >/dev/null 2>&1; then
              npm view "flint-chart-mcp@${mcp_version}" version --prefer-online
              exit 0
            fi
            echo "Waiting for flint-chart-mcp@${mcp_version} to be visible on npm (${attempt}/60)..."
            sleep 20
          done
          echo "::error::flint-chart-mcp@${mcp_version} did not become visible on npm in time."
          exit 1

      - name: Verify published packages
        shell: bash
        run: |
          set -euo pipefail
          if [ "${js_needs_publish}" = true ]; then
            npm dist-tag ls flint-chart
            npm view "flint-chart@${js_version}" name version license repository.url --prefer-online
          fi
          if [ "${mcp_needs_publish}" = true ]; then
            npm dist-tag ls flint-chart-mcp
            npm view "flint-chart-mcp@${mcp_version}" name version license repository.url bin --prefer-online
          fi