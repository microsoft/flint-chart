name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The package's type declarations outgrow Node's default heap.
          NODE_OPTIONS: --max-old-space-size=8192
      - run: npm run site:build
        env:
          # The site bundle outgrows Node's default ~4 GB heap; the runner has 16 GB.
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Compose site
        run: |
          mkdir -p _site
          cp -R site/dist/* _site/
      - name: Publish map boundaries
        # Compiled maps name these URLs: a published file must never change or disappear.
        run: node scripts/publish-site-geo.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
